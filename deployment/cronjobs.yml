apiVersion: batch/v1
kind: CronJob
metadata:
  name: nginx-cron
  namespace: nginx
spec:
  schedule: "*/1 * * * *"  # Runs every minute
  jobTemplate:
    spec:
      template:
        metadata:
          name: cron-job-pod
          labels:
            app: cron-task
        spec:
          containers:
          - name: cron-container
            image: busybox
            command: ["echo", "Hello, Kubernetes! This is a CronJob running a scheduled task."]
          restartPolicy: Never